services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: webtoolset:latest
    container_name: webtoolset
    ports:
      - "8000:80"
    volumes:
      - ./log:/app/log
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
